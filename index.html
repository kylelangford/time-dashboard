<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Report Dashboards</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: #f8fafc; }
        p { color: #94a3b8; margin-bottom: 2rem; }
        .cards {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        a {
            display: block;
            background: #1e293b;
            padding: 2rem 3rem;
            border-radius: 1rem;
            border: 1px solid #334155;
            text-decoration: none;
            color: #f8fafc;
            font-size: 1.5rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        a:hover {
            background: #334155;
            border-color: #38bdf8;
            transform: translateY(-2px);
        }
        .generated {
            color: #64748b;
            font-size: 0.75rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <h1>Time Report Dashboards</h1>
    <p>Select a team member to view their time tracking dashboard</p>
    <div class="cards">
        <a href="kyle.html">Kyle</a>
        <a href="adam.html">Adam</a>
        <a href="christian.html">Christian</a>
    </div>
    <div class="generated">Generated from time-report.db</div>
</body>
</html>
